# 哨兵sentinel实例运行的端口 默认26379
port 26381

# 保护模式
protected-mode no

# 本地ip
bind 127.0.0.1

# 哨兵监听的主服务器 后面的1表示主机挂掉以后进行投票，只需要2票就可以从机变主机
sentinel myid c8258f697ea3e67060e68ad2316772c8da39fbaa

# 设置主机的密码（无密码可以省略）
# sentinel auth-pass mymaster lixl123

# 设置未得到主机响应时间，此处代表5秒未响应视为宕机
sentinel monitor mymaster 127.0.0.1 6381 2

# 设置等待主机活动时间，此处代表15秒主机未活动，则重新选举主机
sentinel down-after-milliseconds mymaster 5000

# 设置重新选举主机后，同一时间同步数据的从机数量，此处代表重新选举主机后，每次2台从机同步主机数据，直到所有从机同步结束
sentinel failover-timeout mymaster 15000

# 执行故障转移时， 最多有2个从服务器同时对新的主服务器进行同步
sentinel config-epoch mymaster 26
sentinel leader-epoch mymaster 26
sentinel known-slave mymaster 127.0.0.1 6379
sentinel known-slave mymaster 127.0.0.1 6380
sentinel known-sentinel mymaster 127.0.0.1 26380 3f35e1dc47bfe2b9b41d33550e4b927b29b2e64e
sentinel known-sentinel mymaster 127.0.0.1 26379 aef775ed9344cd419cb20b88f88de247a5d669a6

sentinel current-epoch 26

# Generated by CONFIG REWRITE
dir "D:\\Major Design\\code\\final\\Redis\\sentinel26381"
